<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Poker Wallet</title>
  <!--
    Favicon build of the app mark (app/components/layout/AppLogo.vue).

    Tuned for small sizes rather than reused verbatim: the tile is full-bleed so
    no pixels are wasted on padding, the chip is proportionally larger, and the
    notches and ring are thicker than the in-app version so they survive being
    downsampled to 16px.

    Colors are baked (accent-600 + white) instead of currentColor: a favicon has
    no inheriting context, and the violet tile keeps the mark legible against
    both light and dark browser chrome, so no prefers-color-scheme switch is
    needed. Built from flat shapes with no <mask> — favicon rasterizers vary in
    their mask support, and the tile background makes masking unnecessary.
  -->
  <rect width="32" height="32" rx="7" fill="#735FE9"/>
  <circle cx="16" cy="16" r="11.4" fill="#FFFFFF"/>
  <g fill="#735FE9">
    <rect x="13.9" y="2.6" width="4.2" height="6" rx="2.1"/>
    <rect x="13.9" y="23.4" width="4.2" height="6" rx="2.1"/>
    <rect x="2.6" y="13.9" width="6" height="4.2" rx="2.1"/>
    <rect x="23.4" y="13.9" width="6" height="4.2" rx="2.1"/>
  </g>
  <circle cx="16" cy="16" r="7.5" fill="none" stroke="#735FE9" stroke-width="2.8"/>
</svg>
